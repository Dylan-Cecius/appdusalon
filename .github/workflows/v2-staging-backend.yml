name: V2 Staging Backend

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type STAGING_ONLY to deploy migrations and Edge Functions to isolated staging"
        required: true
        type: string
  push:
    branches:
      - v2/chatgpt-rebuild

permissions:
  contents: read

concurrency:
  group: "v2-staging-backend"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-staging]') }}
    runs-on: ubuntu-latest
    environment: v2-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.V2_STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.V2_STAGING_DB_PASSWORD }}
      V2_STAGING_PROJECT_REF: ${{ secrets.V2_STAGING_SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate isolated staging target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.confirmation }}" != "STAGING_ONLY" ]]; then
            echo "::error::Deployment confirmation must be exactly STAGING_ONLY."
            exit 1
          fi

          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$V2_STAGING_PROJECT_REF" ]]; then
            echo "::error::Missing one or more V2 staging Supabase secrets."
            exit 1
          fi

          if [[ ! "$V2_STAGING_PROJECT_REF" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid V2_STAGING_SUPABASE_PROJECT_REF format."
            exit 1
          fi

          tracked_url="$(grep -E '^VITE_SUPABASE_URL=' .env | head -n1 | cut -d= -f2- || true)"
          if [[ -n "$tracked_url" && "$tracked_url" == *"$V2_STAGING_PROJECT_REF"* ]]; then
            echo "::error::Staging project ref matches the tracked default Supabase project. Refusing deployment."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link isolated staging project
        run: supabase link --project-ref "$V2_STAGING_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations to staging
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions to staging
        run: supabase functions deploy --project-ref "$V2_STAGING_PROJECT_REF"

      - name: Verify migration history
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
