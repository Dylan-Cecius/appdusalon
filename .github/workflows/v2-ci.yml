name: V2 CI

on:
  push:
    branches:
      - v2/chatgpt-rebuild
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Edge function typecheck
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Preview environment build
        env:
          VITE_SUPABASE_URL: https://preview-ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-publishable-key
          VITE_PREVIEW_DEMO_ONLY: "true"
        run: |
          npm run build -- --mode pages
          grep -R --fixed-strings 'https://preview-ci.supabase.co' dist >/dev/null

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Preview safety smoke tests
        run: npm run test:e2e:preview

      - name: Lint
        run: npm run lint
