name: iOS — envoyer sur TestFlight

# Lancement manuel : onglet Actions > « iOS — envoyer sur TestFlight » > Run workflow.
# Secrets requis (Settings > Secrets and variables > Actions) :
#   ASC_KEY_ID      identifiant de la clé API App Store Connect
#   ASC_ISSUER_ID   Issuer ID de la clé
#   ASC_KEY_P8      contenu complet du fichier AuthKey_XXXX.p8
# L'identifiant d'équipe Apple est inscrit dans le projet Xcode (DEVELOPMENT_TEAM).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Secret manquant : $name"; missing=1; fi
          done
          [ -z "$missing" ]

      # App Store Connect exige le SDK iOS 26 ou plus récent : on prend le Xcode
      # stable le plus récent installé sur le Mac plutôt que celui par défaut.
      - name: Choisir le Xcode le plus récent
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          echo "Xcode retenu : $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major est trop ancien pour App Store Connect (Xcode 26 minimum)."
            ls -d /Applications/Xcode_*.app
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Le package-lock n'est pas synchronisé avec package.json : npm ci échouerait
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx vite build
      - name: Copier le site dans le projet iOS
        run: npx cap sync ios

      - name: Installer la clé App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Le secret peut avoir été collé avec des fins de ligne Windows, sans retours
          # à la ligne ou sans en-têtes : on reconstruit un fichier PEM propre.
          body=$(printf '%s' "$ASC_KEY_P8" \
            | sed 's/-----BEGIN PRIVATE KEY-----//g; s/-----END PRIVATE KEY-----//g' \
            | tr -d ' \t\r\n')
          if [ "${#body}" -lt 100 ]; then
            echo "::error::Le secret ASC_KEY_P8 semble incomplet (${#body} caractères utiles). Recollez tout le contenu du fichier .p8."
            exit 1
          fi
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s\n' "$body" | fold -w 64
            echo "-----END PRIVATE KEY-----"
          } > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archiver l'app
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          # Archive non signée : la signature de distribution est faite à l'export,
          # ce qui évite d'exiger un profil de développement (et donc un appareil enregistré).

      - name: Signer et envoyer sur TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
