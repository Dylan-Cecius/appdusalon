name: V2 Database CI

on:
  workflow_dispatch:
  push:
    branches:
      - v2/chatgpt-rebuild
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "tests/sql/**"
      - ".github/workflows/v2-db-ci.yml"

permissions:
  contents: read

concurrency:
  group: "v2-db-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  legacy-appointment-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: legacy_recovery_tests
          POSTGRES_PASSWORD: local-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres -d legacy_recovery_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test exact legacy migrations against disposable fixtures
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          # No published port, remote database URL, or production credentials.
          root=/tmp/appdusalon-regression
          docker exec "$POSTGRES_CONTAINER" mkdir -p "$root/tests/sql" "$root/supabase/migrations"
          docker cp tests/sql/. "$POSTGRES_CONTAINER:$root/tests/sql/"
          docker cp supabase/migrations/. "$POSTGRES_CONTAINER:$root/supabase/migrations/"
          for test in tests/sql/*.sql; do
            docker exec "$POSTGRES_CONTAINER" psql -X --username postgres --dbname legacy_recovery_tests --set ON_ERROR_STOP=1 --file "$root/$test"
          done

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase database
        run: supabase db start

      - name: Replay all migrations from scratch
        run: supabase db reset --local --no-seed

      - name: Lint database schema
        run: supabase db lint --local --level error --fail-on error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
