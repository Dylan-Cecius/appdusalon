name: V2 Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "v2-preview"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Public Vite variables dedicated to the isolated V2 preview project.
      # The workflow intentionally refuses to fall back to the tracked .env.
      VITE_SUPABASE_URL: ${{ secrets.V2_PREVIEW_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.V2_PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PREVIEW_DEMO_ONLY: "true"
      VITE_DEMO_ACCOUNT_EMAIL: ${{ vars.V2_PREVIEW_DEMO_ACCOUNT_EMAIL }}
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4

      - name: Validate isolated preview configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VITE_SUPABASE_URL}" || -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "::error::Missing V2_PREVIEW_SUPABASE_URL or V2_PREVIEW_SUPABASE_PUBLISHABLE_KEY GitHub secret."
            exit 1
          fi

          if [[ ! "${VITE_SUPABASE_URL}" =~ ^https://[A-Za-z0-9-]+\.supabase\.co/?$ ]]; then
            echo "::error::V2_PREVIEW_SUPABASE_URL is not a valid Supabase project URL."
            exit 1
          fi

          tracked_url="$(grep -E '^VITE_SUPABASE_URL=' .env | head -n1 | cut -d= -f2- || true)"
          tracked_url="${tracked_url%$'\r'}"

          if [[ -n "${tracked_url}" && "${VITE_SUPABASE_URL%/}" == "${tracked_url%/}" ]]; then
            echo "::error::Preview Supabase URL matches the tracked default .env. Use a dedicated isolated preview project."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build V2
        run: npm run build -- --mode pages

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
