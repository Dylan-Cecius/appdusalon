name: V2 Preview

on:
  workflow_dispatch:
  push:
    branches:
      - v2/chatgpt-rebuild

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "v2-preview"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-preview]') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_PREVIEW_STANDALONE: "true"
      VITE_PREVIEW_DEMO_ONLY: "true"
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate standalone preview mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VITE_PREVIEW_STANDALONE" != "true" ]]; then
            echo "::error::Standalone preview mode must be enabled."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build V2
        run: npm run build -- --mode pages

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
