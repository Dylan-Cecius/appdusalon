<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>L'App du Salon V2 — Preview</title>
<style>
:root{--bg:#f7f9fc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#4f46e5;--primary2:#eef2ff;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}.app{display:flex;min-height:100vh}.side{width:245px;background:#fff;border-right:1px solid var(--line);position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column}
.brand{padding:20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:white;display:grid;place-items:center;font-size:22px}.brand b{display:block}.brand small{color:var(--muted)}
.nav{padding:12px;display:grid;gap:4px;overflow:auto}.nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:11px;color:#475569;cursor:pointer}.nav button.active,.nav button:hover{background:var(--primary2);color:#3730a3;font-weight:600}
.profile{margin-top:auto;padding:14px;border-top:1px solid var(--line)}.profilebox{padding:12px;border-radius:12px;background:#f8fafc}.profilebox small{color:var(--muted)}
.main{margin-left:245px;width:calc(100% - 245px)}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.pill{background:#f1f5f9;border-radius:10px;padding:8px 12px;font-size:13px}.content{padding:28px;max-width:1500px;margin:auto}
h1{font-size:30px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 24px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(15,23,42,.035)}.kpi{padding:18px}.kpi .label{font-size:13px;color:var(--muted)}.kpi .value{font-size:28px;font-weight:700;margin-top:8px}.positive{color:var(--green);font-size:12px;margin-top:4px}
.twocol{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:18px}.box{padding:20px}.boxtitle{font-weight:700}.bars{display:flex;align-items:end;height:200px;gap:14px;margin-top:22px}.barwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}.bar{width:100%;max-width:54px;border-radius:8px 8px 2px 2px;background:#6366f1}.barwrap small{color:#94a3b8}
.item{display:flex;align-items:center;gap:12px;padding:11px;background:#f8fafc;border-radius:12px;margin-top:8px}.time{color:#4f46e5;font-weight:700;width:52px}.grow{flex:1}.grow small{display:block;color:var(--muted);margin-top:2px}
.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--primary);color:#fff;cursor:pointer;font-weight:600}.btn.secondary{background:#fff;color:#475569;border:1px solid var(--line)}.btn.green{background:#16a34a}.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}.search{padding:11px 13px;border:1px solid var(--line);border-radius:11px;min-width:280px;background:#fff}
.table{overflow:hidden}.row,.head{display:grid;grid-template-columns:1.5fr 1fr .8fr .8fr;gap:12px;padding:14px 16px;align-items:center}.head{background:#f8fafc;color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:700}.row{border-top:1px solid var(--line);font-size:14px}.row b{font-weight:600}
.servicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.service{padding:18px;cursor:pointer;transition:.15s}.service:hover{transform:translateY(-2px);border-color:#c7d2fe}.service .price{float:right;font-weight:700}.service small{color:var(--muted)}
.pos{display:grid;grid-template-columns:1fr 360px;gap:18px}.ticket{padding:18px;position:sticky;top:84px;height:max-content}.ticketline{display:flex;justify-content:space-between;padding:10px;background:#f8fafc;border-radius:10px;margin-top:7px;font-size:14px}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:700;border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.agenda{overflow:hidden}.ahead,.slot{display:grid;grid-template-columns:80px 1fr 1fr}.ahead{background:#f8fafc;color:var(--muted);font-size:13px;font-weight:700}.ahead div,.slot>div{padding:12px;border-right:1px solid var(--line)}.slot{border-top:1px solid var(--line);min-height:62px}.apt{padding:8px;border-radius:9px;background:#eef2ff;border:1px solid #c7d2fe;font-size:12px;color:#3730a3}
.status{padding:3px 8px;border-radius:999px;font-size:11px}.ok{background:#dcfce7;color:#166534}.low{background:#fef3c7;color:#92400e}.out{background:#fee2e2;color:#991b1b}
.mobileNav{display:none}
.notice{padding:10px 14px;background:#eef2ff;color:#3730a3;border-bottom:1px solid #c7d2fe;text-align:center;font-size:12px}
@media(max-width:900px){.side{display:none}.main{margin-left:0;width:100%}.grid4{grid-template-columns:1fr 1fr}.twocol,.pos{grid-template-columns:1fr}.servicegrid{grid-template-columns:1fr 1fr}.mobileNav{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;border-bottom:1px solid var(--line)}.mobileNav button{white-space:nowrap;border:0;padding:7px 10px;border-radius:99px}.content{padding:18px}.ticket{position:static}}
@media(max-width:550px){.grid4,.servicegrid{grid-template-columns:1fr}.row,.head{grid-template-columns:1.3fr 1fr}.row span:nth-child(n+3),.head span:nth-child(n+3){display:none}.top{padding:0 14px}}
</style>
</head>
<body>
<div class="notice">Preview V2 autonome — données fictives, aucune connexion à la production</div>
<div class="app">
<aside class="side">
<div class="brand"><div class="logo">✂</div><div><b>L’App du Salon</b><small>Preview V2</small></div></div>
<div id="nav" class="nav"></div>
<div class="profile"><div class="profilebox"><b>Salon Éclat</b><small>Compte démo · Lifetime</small></div></div>
</aside>
<main class="main">
<div class="top"><div><b id="topTitle">Tableau de bord</b><div style="font-size:12px;color:#94a3b8">Mode démo local</div></div><div class="pill">Dylan · Démo</div></div>
<div id="mobileNav" class="mobileNav"></div>
<div id="content" class="content"></div>
</main>
</div>
<script>
const views=[['dashboard','Tableau de bord','⌂'],['pos','Caisse','€'],['agenda','Agenda','▣'],['clients','Clients','👥'],['services','Services','✂'],['products','Produits & stock','▦'],['team','Équipe','♙'],['stats','Statistiques','▥'],['reports','Rapports','▤'],['settings','Paramètres','⚙']];
const services=[['Coupe homme',25,30],['Coupe + barbe',35,45],['Barbe',15,20],['Coupe enfant',20,25],['Coloration',55,60],['Soin',18,20]];
const clients=[['Sophie Martin','0471 21 45 87','12 visites','320 €'],['Lucas Bernard','0486 44 12 09','8 visites','198 €'],['Emma Dubois','0492 08 71 22','6 visites','165 €'],['Thomas Leroy','0478 93 54 11','5 visites','140 €'],['Julie Simon','0465 31 80 02','9 visites','252 €']];
const appts=[['09:00','Sophie Martin','Coupe + barbe','Marie'],['10:00','Lucas Bernard','Coupe homme','Thomas'],['11:30','Emma Dubois','Coloration','Marie'],['14:00','Thomas Leroy','Barbe','Thomas'],['15:15','Julie Simon','Coupe homme','Marie'],['17:00','Nicolas Petit','Coupe + barbe','Thomas']];
const products=[['Shampoing réparateur','24','18 €','OK'],['Cire coiffante mate','18','14 €','OK'],["Huile d’argan",'4','26 €','Bas'],['Spray thermo-protecteur','0','19 €','Rupture'],['Peigne carbone','15','7 €','OK']];
let view='dashboard',cart=[];
const euro=n=>new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR'}).format(n);
function setView(id){view=id;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));document.getElementById('topTitle').textContent=views.find(x=>x[0]===id)[1];render()}
function initNav(){const html=views.map(v=>'<button data-view="'+v[0]+'" onclick="setView(\''+v[0]+'\')">'+v[2]+' &nbsp; '+v[1]+'</button>').join('');nav.innerHTML=html;mobileNav.innerHTML=html;document.querySelectorAll('[data-view="dashboard"]').forEach(b=>b.classList.add('active'))}
function dash(){return '<h1>Bonjour Dylan</h1><p class="sub">Voici un aperçu de votre journée au salon.</p><div class="grid4">'+[
['CA aujourd’hui','486 €','+12,8 %'],['Rendez-vous','14','3 à venir'],['Clients','327','+8 ce mois'],['Panier moyen','34,70 €','+4,1 %']].map(x=>'<div class="card kpi"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div><div class="positive">'+x[2]+'</div></div>').join('')+'</div><div class="twocol"><div class="card box"><div class="boxtitle">Chiffre d’affaires · 7 derniers jours</div><div class="bars">'+[42,58,52,77,64,92,81].map((h,i)=>'<div class="barwrap"><div class="bar" style="height:'+h+'%"></div><small>'+['Ven','Sam','Dim','Lun','Mar','Mer','Jeu'][i]+'</small></div>').join('')+'</div></div><div class="card box"><div class="boxtitle">Prochains rendez-vous</div>'+appts.slice(0,4).map(a=>'<div class="item"><span class="time">'+a[0]+'</span><div class="grow"><b>'+a[1]+'</b><small>'+a[2]+' · '+a[3]+'</small></div></div>').join('')+'</div></div>'}
function pos(){return '<div class="pos"><div><h1>Caisse</h1><p class="sub">Clique sur une prestation pour l’ajouter au ticket.</p><div class="servicegrid">'+services.map((s,i)=>'<div class="card service" onclick="addCart('+i+')"><span class="price">'+euro(s[1])+'</span><b>'+s[0]+'</b><br><small>'+s[2]+' min</small></div>').join('')+'</div></div><div class="card ticket"><div class="boxtitle">Ticket</div><div id="cart">'+cartHtml()+'</div></div></div>'}
function cartHtml(){const total=cart.reduce((a,b)=>a+b[1],0);return (cart.length?cart.map((x,i)=>'<div class="ticketline"><span>'+x[0]+'</span><b>'+euro(x[1])+'</b></div>').join(''):'<div style="height:130px;display:grid;place-items:center;color:#94a3b8">Aucune prestation</div>')+'<div class="total"><span>Total</span><span>'+euro(total)+'</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="btn green" '+(!cart.length?'disabled':'')+'>Espèces</button><button class="btn" '+(!cart.length?'disabled':'')+'>Carte</button></div>'+(cart.length?'<button class="btn secondary" style="width:100%;margin-top:8px" onclick="cart=[];render()">Vider</button>':'')}
function addCart(i){cart.push(services[i]);document.getElementById('cart').innerHTML=cartHtml()}
function agenda(){const times=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];return '<div class="toolbar"><div><h1>Agenda</h1><p class="sub" style="margin:0">Jeudi 8 octobre</p></div><button class="btn">+ Nouveau rendez-vous</button></div><div class="card agenda"><div class="ahead"><div>Heure</div><div>Marie</div><div>Thomas</div></div>'+times.map(t=>'<div class="slot"><div>'+t+'</div>'+[0,1].map(col=>{const a=appts.find(x=>x[0].slice(0,2)===t.slice(0,2)&&((x[3]==='Marie'?0:1)===col));return '<div>'+(a?'<div class="apt"><b>'+a[1]+'</b><br>'+a[2]+'</div>':'')+'</div>'}).join('')+'</div>').join('')+'</div>'}
function clientsView(){return '<div class="toolbar"><div><h1>Clients</h1><p class="sub" style="margin:0">327 clients enregistrés</p></div><button class="btn">+ Ajouter</button></div><input id="q" class="search" placeholder="Rechercher un client..." oninput="filterClients()"><div class="card table" style="margin-top:14px"><div class="head"><span>Client</span><span>Téléphone</span><span>Visites</span><span>CA</span></div><div id="clientRows">'+clientRows(clients)+'</div></div>'}
function clientRows(arr){return arr.map(c=>'<div class="row"><b>'+c[0]+'</b><span>'+c[1]+'</span><span>'+c[2]+'</span><span><b>'+c[3]+'</b></span></div>').join('')}
function filterClients(){const q=document.getElementById('q').value.toLowerCase();document.getElementById('clientRows').innerHTML=clientRows(clients.filter(c=>c.join(' ').toLowerCase().includes(q)))}
function simple(title,sub,rows,type){return '<div class="toolbar"><div><h1>'+title+'</h1><p class="sub" style="margin:0">'+sub+'</p></div><button class="btn">+ Ajouter</button></div><div class="card">'+rows.map(r=>'<div class="item" style="margin:0;border-bottom:1px solid var(--line);border-radius:0;background:white"><div class="logo" style="width:36px;height:36px;font-size:17px">'+(type==='product'?'▦':type==='team'?'♙':'✂')+'</div><div class="grow"><b>'+r[0]+'</b><small>'+r.slice(1).join(' · ')+'</small></div>›</div>').join('')+'</div>'}
function stats(){return '<h1>Statistiques</h1><p class="sub">Performance du salon sur les 30 derniers jours.</p><div class="grid4" style="grid-template-columns:repeat(3,1fr)">'+[['CA mensuel','8 740 €','+11,2 %'],['Prestations','286','+7,4 %'],['Nouveaux clients','38','+15,1 %']].map(x=>'<div class="card kpi"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div><div class="positive">'+x[2]+'</div></div>').join('')+'</div><div class="twocol"><div class="card box"><b>Prestations les plus vendues</b>'+[['Coupe homme',92],['Coupe + barbe',71],['Barbe',48],['Coupe enfant',34]].map(x=>'<div style="margin-top:16px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+x[0]+'</span><span>'+x[1]+'</span></div><div style="height:8px;background:#f1f5f9;border-radius:99px;margin-top:6px"><div style="width:'+x[1]+'%;height:8px;background:#6366f1;border-radius:99px"></div></div></div>').join('')+'</div><div class="card box"><b>Répartition paiements</b><div style="display:grid;place-items:center;height:220px"><div style="width:150px;height:150px;border-radius:50%;border:24px solid #6366f1;display:grid;place-items:center;font-size:24px;font-weight:700">64%</div></div></div></div>'}
function reports(){return '<h1>Rapports</h1><p class="sub">Exports et automatisations.</p><div class="servicegrid">'+[['Rapport hebdomadaire','Tous les lundis'],['SMS clients','Automatisations actives'],['CA & performance','PDF / Email']].map(x=>'<div class="card box"><b>'+x[0]+'</b><p class="sub" style="margin:8px 0">'+x[1]+'</p><button class="btn secondary">Ouvrir</button></div>').join('')+'</div>'}
function settings(){return '<h1>Paramètres</h1><p class="sub">Configuration générale du salon.</p><div class="twocol"><div class="card box"><b>Salon</b><label style="display:block;margin-top:14px;font-size:13px">Nom du salon<input class="search" value="Salon Éclat" style="display:block;width:100%;margin-top:6px"></label><label style="display:block;margin-top:12px;font-size:13px">Email<input class="search" value="contact@salon-eclat.demo" style="display:block;width:100%;margin-top:6px"></label><button class="btn" style="margin-top:14px">Enregistrer</button></div><div class="card box"><b>Fonctionnalités</b><div class="item"><div class="grow"><b>Notifications</b><small>Alertes importantes</small></div><input type="checkbox" checked></div><div class="item"><div class="grow"><b>Réservation en ligne</b><small>Autoriser les réservations publiques</small></div><input type="checkbox" checked></div></div></div>'}
function render(){let html='';if(view==='dashboard')html=dash();if(view==='pos')html=pos();if(view==='agenda')html=agenda();if(view==='clients')html=clientsView();if(view==='services')html=simple('Services','Prestations proposées au salon',services.map(s=>[s[0],euro(s[1]),s[2]+' min']),'service');if(view==='products')html=simple('Produits & stock','Inventaire et niveaux de stock',products,'product');if(view==='team')html=simple('Équipe','Membres et accès au salon',[['Marie Dupont','Coiffeuse','09:00–19:00'],['Thomas Martin','Barbier','09:00–19:00'],['Sophie Laurent','Esthéticienne','10:00–18:00']],'team');if(view==='stats')html=stats();if(view==='reports')html=reports();if(view==='settings')html=settings();content.innerHTML=html}
initNav();render();
</script>
</body>
</html>
